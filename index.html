idik dapat menyebutkan nama teknik chest pass dan tujuan penggunaannya untuk operan jarak pendek cepat.",level:"C1",noSoal:"6",kategori:"BASKET"},{no:7,cp:"Peserta didik mampu menerapkan teknik dasar passing bola basket.",materi:"Teknik Passing - Bounce Pass",indikator:"Peserta didik dapat menjelaskan cara melakukan bounce pass yaitu memantulkan bola ke lantai dengan titik pantul 2/3 jarak penerima untuk melewati lawan.",level:"C2",noSoal:"7",kategori:"BASKET"},{no:8,cp:"Peserta didik mampu menerapkan teknik dasar passing bola basket.",materi:"Teknik Passing - Overhead Pass",indikator:"Disajikan situasi pemain dijaga ketat, peserta didik dapat menentukan teknik overhead pass di atas kepala sebagai solusi operan jarak jauh.",level:"C3",noSoal:"8",kategori:"BASKET"},{no:9,cp:"Peserta didik mampu menerapkan teknik dasar passing bola basket.",materi:"Teknik Passing - Baseball Pass",indikator:"Disajikan video fast break, peserta didik dapat menerapkan teknik baseball pass satu tangan seperti lemparan bisbol untuk serangan balik cepat.",level:"C3",noSoal:"9",kategori:"BASKET"},{no:10,cp:"Peserta didik mampu menganalisis keunggulan teknik passing dalam situasi permainan.",materi:"Teknik Passing - Analisis",indikator:"Disajikan 4 skenario pertahanan zone, peserta didik dapat menganalisis perbedaan penggunaan chest pass vs bounce pass untuk membongkar pertahanan.",level:"C4",noSoal:"10",kategori:"BASKET"},{no:11,cp:"Peserta didik mampu menerapkan teknik dasar dribbling bola basket.",materi:"Teknik Dribbling - High Dribble",indikator:"Peserta didik dapat menjelaskan tujuan high dribble (dribble tinggi) untuk membawa bola cepat di area terbuka dengan pantulan setinggi pinggang.",level:"C2",noSoal:"11",kategori:"BASKET"},{no:12,cp:"Peserta didik mampu menerapkan teknik dasar dribbling bola basket.",materi:"Teknik Dribbling - Low Dribble",indikator:"Disajikan situasi dijaga ketat (pressing), peserta didik dapat menerapkan low dribble dengan posisi badan rendah dan melindungi bola untuk menjaga penguasaan.",level:"C3",noSoal:"12",kategori:"BASKET"},{no:13,cp:"Peserta didik mampu menganalisis peraturan dan variasi dribbling.",materi:"Teknik Dribbling - Crossover",indikator:"Disajikan gerakan crossover dribble, peserta didik dapat menganalisis fungsi gerakan untuk mengecoh lawan dengan perpindahan bola cepat dari tangan kanan ke kiri.",level:"C4",noSoal:"13",kategori:"BASKET"},{no:14,cp:"Peserta didik mampu menerapkan peraturan dribbling dalam permainan.",materi:"Teknik Dribbling - Peraturan",indikator:"Disajikan kasus pemain berhenti dribble lalu dribble lagi, peserta didik dapat menentukan pelanggaran double dribble dan behind the back sebagai teknik lanjutan.",level:"C3",noSoal:"14",kategori:"BASKET"},{no:15,cp:"Peserta didik mampu menerapkan teknik dasar shooting bola basket.",materi:"Teknik Shooting - Free Throw",indikator:"Peserta didik dapat menyebutkan nilai dan posisi free throw (lemparan bebas) yaitu 1 angka dari garis 5,80m akibat pelanggaran.",level:"C1",noSoal:"15",kategori:"BASKET"},{no:16,cp:"Peserta didik mampu menerapkan teknik dasar shooting bola basket.",materi:"Teknik Shooting - Lay Up Shoot",indikator:"Peserta didik dapat menjelaskan urutan langkah lay up shoot (dua langkah - tolakan satu kaki - masukkan bola) dengan awalan dari sisi kanan/kiri.",level:"C2",noSoal:"16",kategori:"BASKET"},{no:17,cp:"Peserta didik mampu menerapkan teknik dasar shooting bola basket.",materi:"Teknik Shooting - Jump Shoot",indikator:"Disajikan sikap BEEF (Balance, Eyes, Elbow, Follow Through), peserta didik dapat menerapkan gerakan jump shoot yang benar untuk tembakan jarak menengah.",level:"C3",noSoal:"17",kategori:"BASKET"},{no:18,cp:"Peserta didik mampu menganalisis teknik shooting berdasarkan posisi.",materi:"Teknik Shooting - Hook & Three Point",indikator:"Disajikan posisi Center dekat ring, peserta didik dapat menganalisis perbedaan hook shoot (lemparan kait) dengan three point shoot dari luar garis 6,75m.",level:"C4",noSoal:"18",kategori:"BASKET"},{no:19,cp:"Peserta didik mampu mengevaluasi efektivitas teknik shooting.",materi:"Teknik Shooting - Evaluasi",indikator:"Disajikan data persentase shooting pemain, peserta didik dapat mengevaluasi kapan sebaiknya menggunakan three point shoot vs jump shoot dalam strategi akhir kuarter.",level:"C5",noSoal:"19",kategori:"BASKET"},{no:20,cp:"Peserta didik mampu menerapkan teknik dasar tanpa bola dalam bola basket.",materi:"Teknik Pivot",indikator:"Disajikan situasi pemain menguasai bola tidak boleh travelling, peserta didik dapat menerapkan teknik pivot (poros dengan satu kaki tumpu) untuk melindungi bola dan mencari teman.",level:"C3",noSoal:"20",kategori:"BASKET"},{no:21,cp:"Peserta didik mampu menganalisis teknik rebound dalam bola basket.",materi:"Teknik Rebound",indikator:"Peserta didik dapat membedakan offensive rebound (dari tembakan kawan) dan defensive rebound (dari tembakan lawan) serta sikap box out yang benar.",level:"C4",noSoal:"21",kategori:"BASKET"},{no:22,cp:"Peserta didik mampu menganalisis strategi screen dalam bola basket.",materi:"Teknik Screen",indikator:"Disajikan formasi pick and roll, peserta didik dapat menganalisis fungsi screen (menghalangi penjaga) untuk membuka ruang tembak rekan setim.",level:"C4",noSoal:"22",kategori:"BASKET"},{no:23,cp:"Peserta didik mampu memahami peraturan dasar permainan bola basket.",materi:"Peraturan - Travelling & Foul",indikator:"Peserta didik dapat menjelaskan pengertian travelling (3 langkah tanpa dribble) dan perbedaan personal foul (kontak fisik) dengan technical foul (sikap tidak sportif).",level:"C2",noSoal:"23",kategori:"BASKET"},{no:24,cp:"Peserta didik mampu memahami peraturan waktu dalam bola basket.",materi:"Peraturan - 3, 8, 24 Detik",indikator:"Disajikan situasi permainan, peserta didik dapat menerapkan aturan 3 detik di area key, 8 detik membawa bola ke depan, dan 24 detik harus shooting.",level:"C3",noSoal:"24",kategori:"BASKET"},{no:25,cp:"Peserta didik mampu mengevaluasi peran posisi pemain dalam strategi bola basket.",materi:"Posisi Pemain - PG, SG, SF, PF, C",indikator:"Disajikan karakteristik pemain, peserta didik dapat mengevaluasi tugas Point Guard sebagai pengatur serangan, Center sebagai rebounder dan peran SG, SF, PF dalam tim.",level:"C5",noSoal:"25",kategori:"BASKET"},{no:26,cp:"Peserta didik mampu memahami sejarah dan perkembangan bola voli dunia dan Indonesia.",materi:"Sejarah Bola Voli",indikator:"Disajikan sejarah awal, peserta didik dapat menyebutkan pencipta bola voli William G. Morgan tahun 1895 dengan nama awal Mintonette di YMCA Holyoke.",level:"C1",noSoal:"26",kategori:"VOLI"},{no:27,cp:"Peserta didik mampu memahami sejarah dan perkembangan bola voli dunia dan Indonesia.",materi:"Sejarah Bola Voli - Organisasi",indikator:"Peserta didik dapat menjelaskan kepanjangan PBVSI (Persatuan Bola Voli Seluruh Indonesia) dan FIVB (Federation Internationale de Volleyball) sebagai induk dunia.",level:"C2",noSoal:"27",kategori:"VOLI"},{no:28,cp:"Peserta didik mampu mengidentifikasi sarana dan prasarana bola voli sesuai standar FIVB.",materi:"Sarana - Lapangan Voli",indikator:"Peserta didik dapat menyebutkan ukuran lapangan bola voli 18m x 9m dengan daerah serang 3m dari net dan garis tengah.",level:"C1",noSoal:"28",kategori:"VOLI"},{no:29,cp:"Peserta didik mampu mengidentifikasi sarana dan prasarana bola voli sesuai standar FIVB.",materi:"Sarana - Net & Antena",indikator:"Peserta didik dapat menjelaskan tinggi net putra 2,43m dan putri 2,24m, lebar net 1m, serta fungsi antena sebagai batas samping lapangan.",level:"C2",noSoal:"29",kategori:"VOLI"},{no:30,cp:"Peserta didik mampu mengidentifikasi sarana dan prasarana bola voli sesuai standar FIVB.",materi:"Sarana - Bola Voli",indikator:"Disajikan spesifikasi bola voli keliling 65-67cm berat 260-280gr, peserta didik dapat menerapkan penggunaan bola sesuai standar pertandingan resmi.",level:"C3",noSoal:"30",kategori:"VOLI"},{no:31,cp:"Peserta didik mampu menerapkan teknik dasar servis dalam bola voli.",materi:"Teknik Servis - Servis Bawah",indikator:"Peserta didik dapat menyebutkan sikap awal servis bawah (kaki kiri depan, bola di tangan kiri, ayunan tangan kanan) untuk pemula.",level:"C1",noSoal:"31",kategori:"VOLI"},{no:32,cp:"Peserta didik mampu menerapkan teknik dasar servis dalam bola voli.",materi:"Teknik Servis - Servis Atas",indikator:"Peserta didik dapat menjelaskan perkenaan servis atas yaitu bola dipukul dengan telapak tangan terbuka di atas kepala dengan lecutan pergelangan.",level:"C2",noSoal:"32",kategori:"VOLI"},{no:33,cp:"Peserta didik mampu menerapkan variasi servis dalam bola voli.",materi:"Teknik Servis - Jump Service",indikator:"Disajikan situasi jump service, peserta didik dapat menerapkan tahapan: lempar bola tinggi, awalan, tolakan, pukulan melompat seperti smash servis.",level:"C3",noSoal:"33",kategori:"VOLI"},{no:34,cp:"Peserta didik mampu menganalisis variasi servis dalam bola voli.",materi:"Teknik Servis - Floating Service",indikator:"Peserta didik dapat menganalisis perbedaan floating service (bola mengapung tanpa rotasi) dengan jump service yang keras dan menukik untuk menyulitkan receiver.",level:"C4",noSoal:"34",kategori:"VOLI"},{no:35,cp:"Peserta didik mampu menerapkan teknik servis dalam strategi permainan.",materi:"Teknik Servis - Strategi",indikator:"Disajikan posisi lawan lemah di posisi 5, peserta didik dapat menentukan arah servis yang tepat untuk mengeksploitasi kelemahan penerima servis lawan.",level:"C3",noSoal:"35",kategori:"VOLI"},{no:36,cp:"Peserta didik mampu menerapkan teknik dasar passing bawah bola voli.",materi:"Teknik Passing Bawah",indikator:"Peserta didik dapat menyebutkan sikap awal passing bawah: kedua tangan dikatupkan, lengan lurus, perkenaan di atas pergelangan tangan, dan lutut ditekuk.",level:"C1",noSoal:"36",kategori:"VOLI"},{no:37,cp:"Peserta didik mampu menerapkan teknik dasar passing atas bola voli.",materi:"Teknik Passing Atas",indikator:"Peserta didik dapat menjelaskan sikap passing atas (set up): jari membentuk segitiga di atas dahi, perkenaan ujung jari, dorongan pergelangan tangan.",level:"C2",noSoal:"37",kategori:"VOLI"},{no:38,cp:"Peserta didik mampu menerapkan fungsi passing dalam permainan bola voli.",materi:"Fungsi Passing - Penerimaan & Umpan",indikator:"Disajikan bola servis keras, peserta didik dapat menerapkan passing bawah sebagai penerima pertama dan passing atas sebagai pengumpan ke smasher.",level:"C3",noSoal:"38",kategori:"VOLI"},{no:39,cp:"Peserta didik mampu menganalisis kesalahan teknik passing.",materi:"Analisis Passing - Kesalahan Umum",indikator:"Disajikan video passing salah, peserta didik dapat menganalisis kesalahan perkenaan (siku ditekuk) dan gerakan lanjutan yang menyebabkan bola tidak akurat.",level:"C4",noSoal:"39",kategori:"VOLI"},{no:40,cp:"Peserta didik mampu mengevaluasi kualitas passing dalam sistem permainan.",materi:"Evaluasi Passing - Sistem Penerimaan",indikator:"Peserta didik dapat mengevaluasi efektivitas formasi penerimaan servis dengan 3 pemain (W) vs 2 pemain berdasarkan kualitas passing bawah tim.",level:"C5",noSoal:"40",kategori:"VOLI"},{no:41,cp:"Peserta didik mampu menerapkan teknik smash/spike dalam bola voli.",materi:"Teknik Smash - Tahapan Gerak",indikator:"Peserta didik dapat menyebutkan urutan tahapan smash: awalan (3 langkah), tolakan (dua kaki), pukulan (lecutan lengan), pendaratan (dua kaki mengeper).",level:"C2",noSoal:"41",kategori:"VOLI"},{no:42,cp:"Peserta didik mampu menerapkan jenis-jenis smash dalam bola voli.",materi:"Jenis Smash - Open, Semi, Quick",indikator:"Disajikan umpan tinggi dari tosser, peserta didik dapat menentukan jenis smash open (bola tinggi di sayap) vs semi (bola sedang) dan quick (bola cepat).",level:"C3",noSoal:"42",kategori:"VOLI"},{no:43,cp:"Peserta didik mampu menganalisis teknik block dalam bola voli.",materi:"Teknik Block - Tunggal & Ganda",indikator:"Peserta didik dapat menganalisis perbedaan block tunggal (satu pemain) dan block ganda (dua/ tiga pemain) serta timing lompatan saat lawan smash.",level:"C4",noSoal:"43",kategori:"VOLI"},{no:44,cp:"Peserta didik mampu menerapkan teknik block yang benar.",materi:"Teknik Block - Sikap & Perkenaan",indikator:"Disajikan situasi lawan melakukan quick smash di posisi 3, peserta didik dapat menerapkan sikap block: tangan lurus ke atas, ibu jari berdekatan, menutup arah smash.",level:"C3",noSoal:"44",kategori:"VOLI"},{no:45,cp:"Peserta didik mampu mengevaluasi kombinasi smash dan block dalam strategi.",materi:"Strategi Smash & Block - Evaluasi",indikator:"Disajikan formasi lawan dengan blocker tinggi, peserta didik dapat mengevaluasi penggunaan smash tipuan (lob) dan penempatan bola untuk melewati block.",level:"C5",noSoal:"45",kategori:"VOLI"},{no:46,cp:"Peserta didik mampu memahami sistem penilaian dalam bola voli.",materi:"Peraturan - Rally Point System",indikator:"Peserta didik dapat menjelaskan sistem rally point yaitu setiap reli menghasilkan poin, set berakhir 25 angka dengan selisih minimal 2 angka, set 5 berakhir 15 angka.",level:"C2",noSoal:"46",kategori:"VOLI"},{no:47,cp:"Peserta didik mampu memahami peraturan pemain khusus libero.",materi:"Peraturan - Libero",indikator:"Peserta didik dapat menjelaskan peran libero: pemain bertahan dengan jersey beda, tidak boleh servis, block, dan smash, hanya boleh bermain di baris belakang menggantikan pemain belakang.",level:"C2",noSoal:"47",kategori:"VOLI"},{no:48,cp:"Peserta didik mampu menganalisis peraturan rotasi dan posisi pemain.",materi:"Peraturan - Rotasi & Posisi 1-6",indikator:"Disajikan diagram rotasi searah jarum jam, peserta didik dapat menganalisis posisi 1 (server), 2-4 depan, 5-6 belakang dan pelanggaran faulty rotation.",level:"C4",noSoal:"48",kategori:"VOLI"},{no:49,cp:"Peserta didik mampu memahami jenis pelanggaran dalam bola voli.",materi:"Peraturan - Pelanggaran Net, Double",indikator:"Peserta didik dapat menyebutkan contoh pelanggaran: menyentuh net, double (dua kali sentuhan berurutan), menangkap bola, dan masuk la
